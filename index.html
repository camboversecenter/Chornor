
<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHORNOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Kantumruy Pro', sans-serif;
        background-color: #f3f4f6;
      }
    </style>
    
    <script>
      // Polyfill for process/global buffers which some web3 libs might expect
      window.process = { env: { NODE_ENV: 'production' } };
      window.global = window;

      // Fix for "Cannot set property fetch of #<Window>" error
      // Some libraries try to polyfill fetch by assigning to window.fetch, which is read-only in some environments.
      // We define a setter that does nothing to prevent the error.
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => {}, 
            configurable: true
        });
      } catch (e) {
        console.warn("Could not patch window.fetch", e);
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
