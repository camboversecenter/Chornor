    <script>
      // Default to light; apply dark before first paint only if the user chose it.
      (function () {
        try {
          if (localStorage.getItem('chornor_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      body {
        font-family: 'Kantumruy Pro', sans-serif;
        background-color: #f3f4f6;
      }
      html.dark { background-color: #0b1220; }
      html.dark body { background-color: #0b1220; }
    </style>
    
    <script>
      // Polyfill for process/global buffers which some web3 libs might expect
      window.process = { env: { NODE_ENV: 'production' } };
      window.global = window;

      // Fix for "Cannot set property fetch of #<Window>" error
      // Some libraries try to polyfill fetch by assigning to window.fetch, which is read-only in some environments.
      // We define a setter that does nothing to prevent the error.
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => {}, 
            configurable: true
        });
      } catch (e) {
        console.warn("Could not patch window.fetch", e);
      }
    </script>
